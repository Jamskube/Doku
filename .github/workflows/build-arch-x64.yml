name: Build Arch x64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: arch-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pacman-x64:
    name: Paquet pacman x64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Compilé DANS Arch, contre les bibliothèques d'Arch. C'est ce qui distingue ce
    # paquet de l'AppImage : celle-ci embarquait le GTK et le Mesa d'Ubuntu, que les
    # pilotes d'Arch ne savent pas servir (GDK abandonnait sur EGL_BAD_PARAMETER).
    # Ici, rien n'est transporté et rien n'est traduit — le binaire est lié sur place.
    container:
      image: archlinux:base-devel

    steps:
      - name: Installer la chaîne de construction
        run: |
          pacman -Syu --noconfirm --needed \
            git nodejs npm rust \
            webkit2gtk-4.1 gtk3 libsoup3 openssl \
            pkgconf sudo fakeroot

      - uses: actions/checkout@v7

      # makepkg REFUSE de tourner en root, par conception. Un utilisateur dédié, et le
      # dépôt lui appartient le temps de la construction.
      - name: Préparer l'utilisateur de construction
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Construire le frontend et le binaire
        run: |
          sudo -u builder bash -eo pipefail -c '
            cd "'"$GITHUB_WORKSPACE"'"
            npm ci
            npm run check
            npm test
            npm run tauri build -- --target x86_64-unknown-linux-gnu --no-bundle
          '

      - name: Empaqueter avec makepkg
        run: |
          sudo -u builder bash -eo pipefail -c '
            cd "'"$GITHUB_WORKSPACE"'/packaging/arch"
            makepkg -f --noconfirm --nodeps
            ls -la ./*.pkg.tar.zst
          '

      # Le contrôle qui manquait à l'AppImage : installer POUR DE VRAI, puis vérifier que
      # chaque bibliothèque du binaire se résout. Un « not found » ici, c'est la famille
      # de panne qui a fait échouer l'AppImage — et elle échoue alors en CI, pas chez
      # l'utilisateur.
      - name: Installer et vérifier l'édition de liens
        run: |
          pacman -U --noconfirm packaging/arch/*.pkg.tar.zst
          command -v doku
          if ldd "$(command -v doku)" | grep 'not found'; then
            echo "Des bibliothèques manquent au binaire installé" >&2; exit 1
          fi
          ldd "$(command -v doku)" | grep -cE 'webkit|gtk-3|soup'
          pacman -Qi doku

      - name: Produire le SHA-256
        run: |
          cd packaging/arch
          sha256sum ./*.pkg.tar.zst > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publier le paquet Arch
        uses: actions/upload-artifact@v7
        with:
          name: Doku-${{ github.ref_name }}-arch-x64
          path: |
            packaging/arch/*.pkg.tar.zst
            packaging/arch/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
