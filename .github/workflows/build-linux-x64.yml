name: Build Linux x64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: linux-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage-x64:
    name: AppImage x64
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # WebKitGTK 4.1 + GTK3 + libsoup3 : la webview de Tauri sous Linux. librsvg et
      # patchelf servent à l'empaquetage AppImage, libssl à `native-tls` (reqwest).
      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            build-essential \
            file

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le projet
        run: |
          npm run check
          npm test

      # Aucune préparation de sidecar : sous Linux, Doku lance l'Ollama du système
      # (ADR-0025). `tauri.linux.conf.json` retire `externalBin` et la lib empaquetée.
      # APPIMAGE_EXTRACT_AND_RUN : les runners GitHub n'ont pas FUSE, sans quoi
      # l'outil d'empaquetage échoue au montage de sa propre image.
      # DEUX formats, pour deux publics :
      #  - .deb : ne transporte AUCUNE bibliothèque système, il les DÉCLARE. C'est le seul
      #    qui fonctionne sur une distribution dont la pile graphique diffère de celle du
      #    runner (vécu : l'AppImage embarque le GTK/Mesa d'Ubuntu via
      #    linuxdeploy-plugin-gtk, et GDK abandonne sur « EGL_BAD_PARAMETER » chez Arch).
      #  - .AppImage : pratique là où elle marche, un fichier et rien à installer.
      - name: Construire les paquets x64
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npm run tauri build -- --target x86_64-unknown-linux-gnu --bundles appimage,deb

      - name: Vérifier les paquets et produire les SHA-256
        run: |
          set -euo pipefail
          root="src-tauri/target/x86_64-unknown-linux-gnu/release"
          appimage=$(find "$root/bundle/appimage" -name '*.AppImage' | head -n 1)
          if [ -z "$appimage" ]; then echo "AppImage introuvable" >&2; exit 1; fi

          # Architecture réellement produite : un binaire ARM dans un bundle nommé x64
          # est le genre d'erreur qu'on ne découvre que chez l'utilisateur.
          file "$root/doku" | grep -q 'ELF 64-bit.*x86-64' \
            || { echo "doku n'est pas un ELF x86-64" >&2; exit 1; }

          # Extraction sans FUSE : prouve que l'image est bien formée et contient l'exe.
          workdir=$(mktemp -d)
          (cd "$workdir" && "$OLDPWD/$appimage" --appimage-extract >/dev/null)
          test -x "$workdir/squashfs-root/usr/bin/doku" \
            || { echo "L'AppImage ne contient pas l'exécutable attendu" >&2; exit 1; }

          deb=$(find "$root/bundle/deb" -name '*.deb' | head -n 1)
          if [ -z "$deb" ]; then echo ".deb introuvable" >&2; exit 1; fi

          # Le .deb ne doit embarquer AUCUNE pile graphique : c'est toute sa raison d'être
          # ici. S'il en contenait une, il aurait le défaut qu'on cherche à fuir.
          if bsdtar -tf "$deb" 2>/dev/null | grep -qiE 'libEGL|libgbm|libGL.so'; then
            echo "Le .deb embarque une pile graphique — il perd son intérêt" >&2; exit 1
          fi

          mkdir -p "$root/bundle/publish"
          cp "$appimage" "$deb" "$root/bundle/publish/"
          (cd "$root/bundle/publish" && sha256sum ./* > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publier les paquets x64
        uses: actions/upload-artifact@v7
        with:
          name: Doku-${{ github.ref_name }}-linux-x64
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/publish/*
          if-no-files-found: error
          retention-days: 14
