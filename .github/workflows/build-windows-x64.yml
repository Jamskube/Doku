name: Build Windows x64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nsis-x64:
    name: NSIS x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Restaurer l'archive llama.cpp épinglée
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries/.cache/llama-b12810/llama-b12810-bin-win-cpu-x64.zip
          key: llama-win-cpu-x64-b12810-845e2515

      - name: Installer les dépendances
        run: npm ci

      - name: Préparer le moteur llama.cpp CPU x64
        run: npm run prepare:llama:x64

      - name: Vérifier le projet
        run: |
          npm run check
          npm test

      - name: Construire l'installateur NSIS x64
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis

      - name: Smoke-tester l'installateur et produire le SHA-256
        shell: pwsh
        run: |
          $root = "src-tauri/target/x86_64-pc-windows-msvc/release"
          $installer = Get-ChildItem "$root/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installateur NSIS x64 introuvable" }

          function Assert-X64([string]$path) {
            $bytes = [IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
            if ($machine -ne 0x8664) { throw "$path n'est pas un binaire PE x64 (machine=0x$($machine.ToString('x4')))" }
          }

          Assert-X64 "$root/doku.exe"
          Assert-X64 "src-tauri/binaries/llama/llama-server.exe"

          $installDir = "$env:LOCALAPPDATA/Doku"
          $install = Start-Process $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installation silencieuse échouée ($($install.ExitCode))" }

          $doku = "$installDir/doku.exe"
          $llamaServer = "$installDir/llama/llama-server.exe"
          $license = "$installDir/licenses/llama.cpp-LICENSE.txt"
          foreach ($required in @($doku, $llamaServer, $license)) {
            if (-not (Test-Path $required)) { throw "Fichier installé manquant : $required" }
          }
          Assert-X64 $doku
          Assert-X64 $llamaServer

          # Le routeur installé doit charger ses DLL et répondre — preset vide, comme au
          # premier lancement de Doku avant tout téléchargement de modèle.
          $preset = "$env:RUNNER_TEMP/doku-smoke.ini"
          "version = 1`n`n[*]`nthreads = 4" | Set-Content $preset -Encoding ascii
          $server = Start-Process $llamaServer -ArgumentList "--host","127.0.0.1","--port","11589","--models-preset",$preset,"--offline","--no-ui" -WorkingDirectory "$installDir/llama" -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try {
                $models = Invoke-RestMethod "http://127.0.0.1:11589/models" -TimeoutSec 2
                if ($null -ne $models.data) { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw "Le moteur llama.cpp installé n'est pas devenu prêt" }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content "$root/bundle/nsis/SHA256SUMS.txt" -Encoding ascii

      - name: Publier l'installateur x64
        uses: actions/upload-artifact@v7
        with:
          name: Doku-${{ github.ref_name }}-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
