name: CI

# Vérifie CHAQUE push et chaque PR — les workflows build-* ne tournent que sur tag ou à
# la main, donc `main` n'était jamais vérifié par une machine. Ici : typecheck Svelte,
# tests vitest, build Vite, puis clippy et tests Rust sur les deux cibles Windows.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (check · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  rust:
    name: Rust (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            engine: x64
            cache-path: src-tauri/binaries/.cache/llama-b12810/llama-b12810-bin-win-cpu-x64.zip
            cache-key: llama-win-cpu-x64-b12810-845e2515
          - label: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            engine: arm64
            cache-path: src-tauri/binaries/.cache/llama-b12810/llama-b12810-bin-win-cpu-arm64.zip
            cache-key: llama-win-cpu-arm64-b12810-b14e4742
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # `tauri-build` vérifie la présence des ressources à la compilation : le dossier du
      # moteur doit exister même pour `cargo test`. Même cache que les workflows de build.
      - name: Restaurer l'archive llama.cpp épinglée
        uses: actions/cache@v6
        with:
          path: ${{ matrix.cache-path }}
          key: ${{ matrix.cache-key }}
      - run: npm ci
      - run: npm run prepare:llama:${{ matrix.engine }}
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --target ${{ matrix.target }} --all-targets -- -D warnings
      - name: Tests Rust
        working-directory: src-tauri
        run: cargo test --target ${{ matrix.target }}
